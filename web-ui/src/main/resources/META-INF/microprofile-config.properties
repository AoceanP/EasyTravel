# WHAT: defaults for running the website next to the services on one machine.
# WHY:  Docker Compose overrides each one with an environment variable
#       (MicroProfile Config maps "gateway/mp-rest/url" to GATEWAY_MP_REST_URL,
#       "rabbitmq.host" to RABBITMQ_HOST, and so on).

# the API gateway, the website's only HTTP entry into the back end
gateway/mp-rest/url=http://localhost:8080
gateway/mp-rest/connectTimeout=2000
gateway/mp-rest/readTimeout=5000
# one shared client for the whole app (also lets page beans hold it safely)
gateway/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped

# Ops room sources, called directly inside the Docker network (never through
# the gateway): payment-service's demo switch, Eureka, RabbitMQ's management API.
# Short timeouts: the Ops room shows "unknown" rather than waiting.
payments/mp-rest/url=http://localhost:8083
payments/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped
payments/mp-rest/connectTimeout=1000
payments/mp-rest/readTimeout=1500
eureka/mp-rest/url=http://localhost:8761
eureka/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped
eureka/mp-rest/connectTimeout=1000
eureka/mp-rest/readTimeout=1500
rabbitmq-admin/mp-rest/url=http://localhost:15672
rabbitmq-admin/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped
rabbitmq-admin/mp-rest/connectTimeout=1000
rabbitmq-admin/mp-rest/readTimeout=1500

# the Ops room's "break it" buttons; on only where docker-compose turns them on
easytravel.demo-controls=false

# Sign-in (Keycloak). One address for the browser and the container (see docker-compose).
# The client secret has no default on purpose: it comes from EASYTRAVEL_OIDC_SECRET (.env).
easytravel.oidc.provider-uri=http://keycloak.localhost:8180/realms/easytravel
easytravel.oidc.client-id=web-ui
easytravel.oidc.post-logout-uri=http://localhost:9080/login.xhtml

# RabbitMQ, for live updates
rabbitmq.host=localhost
rabbitmq.port=5672

# the mock card's limit in payment-service, used only to warn before booking
easytravel.card-limit=2000.00

# when this WAR was built (filled in by Maven); versions the stylesheet URL
easytravel.build=${build.stamp}
