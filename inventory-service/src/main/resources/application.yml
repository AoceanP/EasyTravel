server:
  port: 8081

spring:
  application:
    name: inventory-service

inventory:
  ranking:
    price-weight: 0.6
    duration-weight: 0.4

eureka:
  instance:
    # Heartbeat every 5 s (default 30 s). On a full restart a service can boot
    # before Eureka does; its first registration then fails, and the next
    # heartbeat is what registers it. 5 s instead of 30 s gets the stack serving
    # in seconds. Expiry is scaled to match: 3 missed heartbeats.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}