server:
  port: 8080          # the single front door

spring:
  application:
    name: api-gateway

  cloud:
    loadbalancer:
      cache:
        ttl: 5s   # the load balancer keeps its own copy of the registry (default 35 s)
    gateway:
      server:
        webflux:
          # Auto-create routes from Eureka service names — optional convenience.
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          # Explicit routes: clearer and what we'll rely on.
          routes:
            - id: inventory-service
              # lb:// means "load-balanced via Eureka" — resolve this service NAME
              # through the registry rather than a hardcoded address.
              uri: lb://inventory-service
              predicates:
                - Path=/api/flights/**

            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**

eureka:
  client:
    # Re-fetch the registry every 5 s (default 30 s), so a freshly started stack
    # routes requests within seconds instead of answering 503 for half a minute.
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}