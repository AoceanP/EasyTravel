server:
  port: 8080          # the single front door

spring:
  application:
    name: api-gateway

  cloud:
    loadbalancer:
      cache:
        ttl: 5s   # the load balancer keeps its own copy of the registry (default 35 s)
    gateway:
      server:
        webflux:
          # Off on purpose: the discovery locator would publish EVERY path of every
          # service as /{service-name}/**, including internal and admin endpoints.
          # Only the explicit routes below are exposed.
          discovery:
            locator:
              enabled: false
          # Explicit routes: clearer and what we'll rely on.
          routes:
            - id: inventory-service
              # lb:// means "load-balanced via Eureka" — resolve this service NAME
              # through the registry rather than a hardcoded address.
              uri: lb://inventory-service
              predicates:
                - Path=/api/flights/**

            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**

eureka:
  instance:
    # Heartbeat every 5 s (default 30 s). On a full restart a service can boot
    # before Eureka does; its first registration then fails, and the next
    # heartbeat is what registers it. 5 s instead of 30 s gets the stack serving
    # in seconds. Expiry is scaled to match: 3 missed heartbeats.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
  client:
    # Re-fetch the registry every 5 s (default 30 s), so a freshly started stack
    # routes requests within seconds instead of answering 503 for half a minute.
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}