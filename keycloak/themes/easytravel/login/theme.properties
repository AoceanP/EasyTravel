# WHAT: the EasyTravel login theme: Keycloak's own login pages, recoloured to
#       match the website (warm off-white page, slate text, one amber accent).
# WHY:  extending keycloak.v2 keeps every login page and future fix from
#       Keycloak; only the look changes. darkMode is off so the page stays
#       light like the website instead of following the browser's dark mode.
parent=keycloak.v2
import=common/keycloak
darkMode=false
styles=css/styles.css css/easytravel.css
