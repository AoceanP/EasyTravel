server:
  port: 8082

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s   # the load balancer keeps its own copy of the registry (default 35 s)
  application:
    name: booking-service

  # In-memory database: zero setup. Data is lost when the service stops (fine for a demo).
  datasource:
    url: jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false   # no lazy loading during view rendering; transactions end in the service layer

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # A failing message is retried 3 times with growing gaps, then rejected
        # WITHOUT requeue, which sends it to the dead-letter queue instead of
        # looping forever ("poison message").
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2.0

easytravel:
  inventory:
    base-url: http://inventory-service   # a Eureka service NAME, resolved by the load balancer

eureka:
  client:
    # Re-fetch the registry every 5 s (default 30 s), so a freshly started stack
    # routes requests within seconds instead of answering 503 for half a minute.
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
